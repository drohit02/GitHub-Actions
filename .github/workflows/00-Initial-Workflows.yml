# Initial GitHub Actions Workflow

name: "🚀 [Initial-Workflow] Initial GitHub Actions Workflow"

run-name: "🚀 [Initial-Workflow] ${{ github.actor }} → Initiating GitHub Actions"

on:

  push:

jobs:

  checks-bats-version:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7

        with:

          node-version: '24'

      - run: echo "Installing the Node packages"

      - run: npm install -g bats

      - run: echo "Checking the Bats version"

      - run: bats -v